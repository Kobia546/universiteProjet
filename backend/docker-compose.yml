services:
  postgres:
    image: postgres:16-alpine
    container_name: erp_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: erp_universite
    ports:
      - "5432:5432"
    volumes:
      - erp_pg_data:/var/lib/postgresql/data

volumes:
  erp_pg_data:
